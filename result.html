<!DOCTYPE html>
<html>
<head>
    <title>AI Jugaad - Result</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: #2563eb;
        }

        h2 {
            color: #333;
        }

        .problem {
            background: #eef2ff;
            padding: 15px;
            border-radius: 10px;
        }

        .answer {
            background: #f8fafc;
            padding: 20px;
            border-radius: 10px;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI JUGAAD BY (MUZAMIL AHMAD)</h1>    <p>Smart Problem Solver</p>

    <h2>📝 Your Problem</h2>

    <div class="problem">
        {{ problem }}
    </div>

    <h2>💡 AI Solution</h2>

    <div class="answer">
        {{ answer }}
    </div>

    <a href="/">← Solve Another Problem</a>

</div>

</body>
</html>
