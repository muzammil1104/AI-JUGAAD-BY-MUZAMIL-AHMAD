<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI JUGAAD BY (MUZAMIL AHMAD) | Result</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0b1120;
            color: white;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
        }

        .logo {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .logo span {
            color: #38bdf8;
        }

        .card {
            background: #172033;
            border: 1px solid #26344d;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 15px;
            color: #38bdf8;
        }

        .problem {
            background: #0f172a;
            padding: 20px;
            border-radius: 12px;
            line-height: 1.7;
            direction: ltr;
            text-align: left;
            white-space: pre-wrap;
        }

        .answer {
            background: #0f172a;
            padding: 25px;
            border-radius: 12px;
            line-height: 1.9;
            white-space: pre-wrap;
            text-align: left;
            direction: auto;
        }

        .back {
            display: block;
            text-align: center;
            background: #38bdf8;
            color: #07111f;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        🤖 AI <span>JUGAAD BY (MUZAMIL AHMAD)</span>
    </div>

    <div class="card">

        <h2>📝 Your Problem</h2>

        <div class="problem">
{{ problem }}
        </div>

    </div>

    <div class="card">

        <h2>💡 AI Solution</h2>

        <div class="answer">
{{ answer }}
        </div>

    </div>

    <a class="back" href="/">
        ← Solve Another Problem
    </a>

</div>

</body>
</html>
